project:
  manifest: data/processed/manifest_4clients_seed42.csv
  random_seed: 42

model:
  name: SegResNet
  in_channels: 4
  num_classes: 4
  init_filters: 32
  dropout_prob: 0.1

training:
  patch_size: [128, 128, 128]
  batch_size: 2
  grad_accum_steps: 2
  learning_rate: 0.0001
  weight_decay: 0.00001
  grad_clip_norm: 12.0
  max_epochs_or_rounds: 120
  early_stop_patience: 20
  local_epochs: 1

sampling:
  p_et: 0.20
  p_tumor: 0.50
  p_foreground: 0.20
  p_random: 0.10

loss:
  ce_weight: [0.10, 1.00, 1.00, 1.25]
  dice_loss_weight: 1.0
  ce_loss_weight: 1.0

federated:
  methods: [fedavg, fedprox]
  fedprox_mu: 0.001

inference:
  roi_size: [128, 128, 128]
  sw_batch_size: 1
  overlap: 0.5
  mode: gaussian

retrieval:
  roi_source: predicted_wt_center
  allow_gt_fallback: false
  embedding_method: multiscale_gap_gmp
  top_k: [1, 3, 5, 10]
